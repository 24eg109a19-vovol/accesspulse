<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Analytics - AccessPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('analytics')}"></div>

        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Institutional Accessibility Analytics</h1>
                    <p class="page-subtitle">Real-time reports, barrier frequency distributions, resolution metrics, and priority load charts.</p>
                </div>
                <button onclick="window.print()" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-print"></i> Export / Print Report
                </button>
            </div>

            <!-- Top Highlights Grid -->
            <div class="grid grid-cols-4" style="margin-bottom: 2rem;">
                <div class="stat-card">
                    <div class="stat-icon primary"><i class="fa-solid fa-layer-group"></i></div>
                    <div class="stat-details">
                        <h4>Total Received</h4>
                        <div class="stat-value" th:text="${stats.total}">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon success"><i class="fa-solid fa-check-circle"></i></div>
                    <div class="stat-details">
                        <h4>Resolved</h4>
                        <div class="stat-value" th:text="${stats.resolved}">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon warning"><i class="fa-solid fa-spinner"></i></div>
                    <div class="stat-details">
                        <h4>In Progress</h4>
                        <div class="stat-value" th:text="${stats.inProgress}">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fa-solid fa-percent"></i></div>
                    <div class="stat-details">
                        <h4>Resolution Rate</h4>
                        <div class="stat-value" th:text="${stats.resolutionRate} + '%'">0%</div>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-2">
                
                <!-- Status Distribution Chart -->
                <div class="card">
                    <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--dark); margin-bottom: 1rem;">
                        <i class="fa-solid fa-chart-pie" style="color: var(--primary);"></i> Barrier Status Breakdown
                    </h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="statusChart" 
                                th:attr="data-resolved=${stats.resolved}, data-inprogress=${stats.inProgress}, data-pending=${stats.pending}">
                        </canvas>
                    </div>
                </div>

                <!-- Priority Levels Chart -->
                <div class="card">
                    <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--dark); margin-bottom: 1rem;">
                        <i class="fa-solid fa-chart-bar" style="color: var(--danger);"></i> Priority Severity Distribution
                    </h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="priorityChart" 
                                th:attr="data-critical=${stats.critical}, data-high=${stats.high}, data-medium=${stats.inProgress}, data-low=${stats.resolved}">
                        </canvas>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/dashboard-charts.js}"></script>
</body>
</html>
