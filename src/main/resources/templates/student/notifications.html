<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - AccessPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('notifications')}"></div>

        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Notification Alerts</h1>
                    <p class="page-subtitle">Real-time updates regarding status progression, assignments, and verification requests.</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <button type="submit" class="btn btn-secondary btn-sm">
                        <i class="fa-solid fa-check-double"></i> Mark All as Read
                    </button>
                </form>
            </div>

            <div class="card" style="max-width: 850px; margin: 0 auto; padding: 0;">
                <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                    <i class="fa-regular fa-bell-slash" style="font-size: 2.5rem; color: var(--text-muted); margin-bottom: 0.75rem;"></i>
                    <p>No notifications yet.</p>
                </div>

                <div th:each="n : ${notifications}" 
                     style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;"
                     th:styleappend="${!n.read ? 'background: var(--table-hover-bg);' : ''}">
                    <div style="display: flex; gap: 1rem; align-items: flex-start;">
                        <div style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
                             th:styleappend="${!n.read ? 'background: var(--primary-light); color: var(--primary);' : 'background: var(--input-bg); color: var(--text-secondary);'}">
                            <i class="fa-solid fa-bell"></i>
                        </div>
                        <div>
                            <div style="font-weight: 700; color: var(--text-primary); font-size: 0.95rem;" th:text="${n.title}">Title</div>
                            <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.2rem;" th:text="${n.message}">Message</p>
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Date</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <a th:if="${n.linkUrl != null}" th:href="@{${n.linkUrl}}" class="btn btn-primary btn-sm">
                            View
                        </a>
                        <form th:if="${!n.read}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                            <button type="submit" class="btn btn-secondary btn-sm" title="Mark as Read">
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
