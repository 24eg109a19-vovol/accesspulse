<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AccessPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="auth-page-container">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>

        <div class="auth-split-box" style="max-width: 600px; grid-template-columns: 1fr;">
            <div class="auth-form-panel" style="padding: 3rem 2.5rem;">
                <div class="form-header">
                    <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; margin-bottom: 1rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="form-title">Create Account</h1>
                    <p class="form-subtitle">Join the Campus Barrier Resolution Network</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" th:object="${registrationRequest}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="fullName">Full Name</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control input-with-icon" placeholder="e.g. Jane Doe" required>
                        </div>
                        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-text" style="color: var(--danger);"></div>
                    </div>

                    <div class="form-group" style="margin-top: 1.25rem;">
                        <label class="form-label" for="email">Campus Email</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="email" th:field="*{email}" class="form-control input-with-icon" placeholder="jane@campus.edu" required>
                        </div>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-text" style="color: var(--danger);"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label" for="role">User Role</label>
                            <select id="role" th:field="*{role}" class="form-select" style="height: 48px;">
                                <option th:value="${T(com.accesspulse.enums.Role).ROLE_STUDENT}">Student</option>
                                <option th:value="${T(com.accesspulse.enums.Role).ROLE_STAFF}">Staff / Faculty</option>
                                <option th:value="${T(com.accesspulse.enums.Role).ROLE_MAINTENANCE}">Maintenance Staff</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="departmentOrId">ID / Department</label>
                            <input type="text" id="departmentOrId" th:field="*{departmentOrId}" class="form-control" style="height: 48px;" placeholder="e.g. STU-1029">
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1.25rem;">
                        <label class="form-label" for="phone">Phone Number (Optional)</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control input-with-icon" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" style="height: 48px;" placeholder="••••••••" required>
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-text" style="color: var(--danger);"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" style="height: 48px;" placeholder="••••••••" required>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-text" style="color: var(--danger);"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-submit" style="margin-top: 1.75rem;">
                        <span>Create Account</span>
                        <i class="fa-solid fa-check"></i>
                    </button>
                </form>

                <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                    Already have an account? <a th:href="@{/login}" style="font-weight: 700; color: var(--primary);">Sign in here</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
