<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Maintenance Staff - AccessPulse Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('complaints')}"></div>

        <main class="dashboard-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Assign Maintenance Engineer</h1>
                    <p class="page-subtitle" th:text="'Dispatch staff to resolve #' + ${complaint.id} + ': ' + ${complaint.title}"></p>
                </div>
            </div>

            <div class="grid grid-cols-3" style="max-width: 1000px; margin: 0 auto;">
                
                <!-- Left: Form -->
                <div style="grid-column: span 2;">
                    <div class="card">
                        <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--dark);">
                            Assignment Details & Instructions
                        </h3>

                        <form th:action="@{'/admin/complaints/' + ${complaint.id} + '/assign'}" th:object="${assignStaffRequest}" method="post">
                            <input type="hidden" th:field="*{complaintId}">
                            
                            <div class="form-group">
                                <label class="form-label" for="staffId">Select Maintenance Staff Member *</label>
                                <select id="staffId" th:field="*{staffId}" class="form-select" required>
                                    <option value="" disabled selected>-- Choose Technician --</option>
                                    <option th:each="staff : ${maintenanceStaff}" 
                                            th:value="${staff.id}" 
                                            th:text="${staff.fullName} + ' (' + ${staff.departmentOrId} + ')'">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('staffId')}" th:errors="*{staffId}" class="form-text" style="color: var(--danger);"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="targetCompletionDate">Target Resolution Deadline</label>
                                <input type="date" id="targetCompletionDate" th:field="*{targetCompletionDate}" class="form-control">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="instructions">Work Order Instructions / Parts Guidance</label>
                                <textarea id="instructions" th:field="*{instructions}" class="form-control" rows="4" 
                                          placeholder="e.g. Inspect door motor sensor, replace safety latch, bring high-torque wrench..."></textarea>
                            </div>

                            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                                <a th:href="@{/admin/complaints}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                                    <i class="fa-solid fa-paper-plane"></i> Dispatch Work Order
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Right: Issue Summary -->
                <div>
                    <div class="card">
                        <h4 style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.75rem;">Issue Overview</h4>
                        <div style="font-weight: 700; color: var(--dark); font-size: 1.1rem; margin-bottom: 0.5rem;" th:text="${complaint.title}">Title</div>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;" th:text="${complaint.description}">Description</p>
                        
                        <div style="border-top: 1px solid var(--border-color); padding-top: 0.75rem; font-size: 0.85rem; color: var(--text-secondary);">
                            <div><strong>Location:</strong> <span th:text="${complaint.location.formattedName}">Location</span></div>
                            <div style="margin-top: 0.35rem;"><strong>Calculated Priority:</strong> <span th:text="${complaint.priorityLevel.displayName} + ' (' + ${complaint.priorityScore} + ')'">HIGH</span></div>
                        </div>

                        <div th:if="${complaint.imagePath != null}" style="margin-top: 1rem;">
                            <img th:src="@{'/uploads/' + ${complaint.imagePath}}" alt="Evidence" style="width: 100%; border-radius: var(--radius-sm); max-height: 180px; object-fit: cover;">
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
